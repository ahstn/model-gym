# ModernBERT-base full fine-tune. Targets one RTX 3090 (24 GiB, sm_86).
#
#   uv run model-gym build-data
#   uv run --extra train model-gym train --config configs/base.yaml
#
data:
  sources:
    - data/seed
  include_synthetic: true
  ratios: [0.7, 0.15, 0.15]

model:
  name: answerdotai/ModernBERT-base
  # Commands are short; 256 covers multi-flag cloud and SQL statements with room to spare.
  max_seq_length: 256
  # sdpa is the safe default. flash_attention_2 is faster on sm_86 but needs a
  # matching flash-attn build for this torch/CUDA pair.
  attn_implementation: sdpa

train:
  output_dir: runs/modernbert-base-v2
  epochs: 4
  learning_rate: 3.0e-5
  batch_size: 32
  eval_batch_size: 64
  warmup_ratio: 0.06
  weight_decay: 0.01
  lr_scheduler: cosine
  # Ampere has native bf16; it needs no loss scaling and is more stable than fp16.
  bf16: true
  fp16: false
  gradient_checkpointing: false
  # The bootstrap corpus is only mildly skewed (1.5:1). Set sqrt or balanced
  # if real traffic is dominated by one level.
  class_weighting: none
  early_stopping_patience: 2
  selection_metric: safety
  max_critical_miss_rate: 0.05
  max_unsafe_allow_rate: 0.01
  max_unnecessary_intervention_rate: 0.25
  evaluate_test: false
  logging_steps: 25
  save_total_limit: 2
  dataloader_num_workers: 4

export:
  precision: int8
  # arm64 matches Apple Silicon runtimes. Use avx512_vnni for x86 cloud CPUs and
  # avx2 for older x86.
  quant_target: arm64
