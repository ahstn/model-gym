[tools]
ruff = "latest"
uv = "latest"

[tasks.setup]
description = "Install dependencies"
run = "uv sync"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Check formatting and lint"
run = "uv run ruff check . && uv run ruff format --check ."

[tasks.fmt]
description = "Format and autofix"
run = "uv run ruff format . && uv run ruff check --fix ."

[tasks.parity]
description = "Check decoding matches visual-quality frozen views"
run = "uv run --with ../visual-quality pytest tests/test_view_parity.py"
