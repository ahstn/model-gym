[project]
name = "image-stats"
version = "0.1.0"
description = "Deterministic, model-free image quality statistics for labelling, teacher prompts, and inference"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
image-stats = "image_stats.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["image_stats", "tests"]
