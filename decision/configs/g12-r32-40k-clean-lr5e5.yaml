# Matched LoRA on gemma-4-12B-it: R3 data recipe on the decontaminated pool (SargeDev excluded, suite 13-gram hits
# removed), Winnow-12B adapter shape (r32, alpha 64, all 7 text-decoder projections; the vision tower is skipped).
# Micro-batches are capped at 16 rows / 32k tokens (fit test: ~55 GiB peak at 16 x 2048). Two option orders per
# choice row with consistency_weight 1.0: on 2B this beat the plain clean run on every dev slice.
# lr 5e-5: the same run at lr 1e-4 (g12-r32-40k-clean) had grad-norm spikes up to 360 and collapsed at step ~210.
name: g12-r32-40k-clean-lr5e5
model: google/gemma-4-12B-it
pool: data/pool-clean.jsonl
n_rows: 40000
exclude_datasets: [sargedev]
dev_panel: data/panels/dev.jsonl
dev_subset: 3000
max_seq_tokens: 2048
batch_tokens: 32768
max_rows_per_micro: 16
rows_per_step: 64
epochs: 1
lr: 5.0e-5
weight_decay: 0.0
warmup_ratio: 0.03
min_lr_ratio: 0.1
grad_clip: 1.0
lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
shuffle_options: true
consistency_weight: 1.0
eval_every: 125
save_every: 0
seed: 0
gradient_checkpointing: true
out_root: runs
