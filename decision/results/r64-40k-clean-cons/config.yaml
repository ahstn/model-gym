# r64-40k-clean plus a second option order for every choice row: mean soft CE of both views + 1.0 * symmetric KL
# between the two views, compared per original option.
name: r64-40k-clean-cons
model: openbmb/MiniCPM5-2B
pool: data/pool-clean.jsonl
n_rows: 40000
exclude_datasets: [sargedev]
dev_panel: data/panels/dev.jsonl
dev_subset: 3000
max_seq_tokens: 2048
batch_tokens: 65536
max_rows_per_micro: 64
rows_per_step: 64
epochs: 1
lr: 1.0e-4
weight_decay: 0.0
warmup_ratio: 0.03
min_lr_ratio: 0.1
grad_clip: 1.0
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
shuffle_options: true
consistency_weight: 1.0
eval_every: 100
save_every: 0
seed: 0
gradient_checkpointing: true
out_root: runs
